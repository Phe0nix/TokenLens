<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>Palext</title>
  <link rel="stylesheet" href="css/popup.css" />
</head>
<body>

<!-- Header -->
<header class="header" role="banner">
  <div class="site-head">
    <div class="site-logo" id="siteLogo" aria-hidden="true">
      <img id="siteLogoImg" alt="" class="hidden" />
      <span id="siteLogoFallback">?</span>
    </div>
    <div class="site-meta">
      <div class="site-name" id="siteName">Scanning page...</div>
      <div class="site-url" id="siteDomain">Scanning page...</div>
    </div>
  </div>
  <div class="header-btns">
    <button class="mode-btn" id="modeBtn" aria-label="Free plan — click to learn about Pro" title="Pro features coming soon">Free</button>
    <button class="icon-btn" id="sidePanelBtn" aria-label="Palext is already open in the side panel" title="Already in side panel"><span class="sidepanel-icon" aria-hidden="true"><span></span></span></button>
    <button class="icon-btn" id="inspectBtn" aria-label="Pick an element on the page to see its tokens" title="Pick Element">⊕</button>

    <button class="icon-btn" id="refreshBtn" aria-label="Re-scan page" title="Re-scan">↺</button>
    <button class="icon-btn" id="saveBtn" aria-label="Save this site's tokens" title="Save">🔖</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" title="Toggle theme">☀️</button>
    <button class="icon-btn text-btn" id="replayTourBtn" aria-label="Replay quick tour" title="Replay tour">Tour</button>
  </div>
</header>

<!-- Tabs -->
<nav aria-label="Token categories">
  <div class="tabs" role="tablist">
    <button class="tab-btn active" data-tab="colors" role="tab" aria-selected="true">
      🎨 Colors <span class="tab-count" id="cnt_colors">0</span>
    </button>
    <button class="tab-btn" data-tab="fonts" role="tab" aria-selected="false">
      Aa Typography <span class="tab-count" id="cnt_fonts">0</span>
    </button>
    <button class="tab-btn" data-tab="spacing" role="tab" aria-selected="false">
      ⬜ Spacing + Radius <span class="tab-count" id="cnt_spacing">0</span>
    </button>
    <button class="tab-btn" data-tab="shadows" role="tab" aria-selected="false">
      🌑 Effects <span class="tab-count" id="cnt_shadows">0</span>
    </button>
    <button class="tab-btn" data-tab="vars" role="tab" aria-selected="false">
      — Variables <span class="tab-count" id="cnt_vars">0</span>
    </button>
    <button class="tab-btn" data-tab="assets" role="tab" aria-selected="false">
      🖼️ Assets <span class="tab-count" id="cnt_assets">0</span>
    </button>
    <button class="tab-btn" data-tab="insights" role="tab" aria-selected="false">
      ✨ Insights <span class="tab-count" id="cnt_insights">0</span>
    </button>
    <button class="tab-btn" data-tab="history" role="tab" aria-selected="false">
      🕘 History <span class="tab-count" id="cnt_history">0</span>
    </button>
  </div>
</nav>

<!-- Export bar -->
<div class="export-bar" id="exportBar" aria-label="Export options">
  <span class="exp-meta" id="lastExportHint" aria-live="polite">Last used: CSS</span>
  <button class="exp-btn" id="openExportModalBtn" aria-label="Open export options">Export</button>
</div>

<!-- View options -->
<div class="export-bar view-options-bar" id="viewOptionsBar" aria-label="View options">
  <span class="export-label">Units:</span>
  <div class="unit-toggle" role="group" aria-label="Display unit">
    <button class="unit-btn active" data-unit="px" aria-pressed="true">px</button>
    <button class="unit-btn" data-unit="rem" aria-pressed="false">rem</button>
    <button class="unit-btn" data-unit="em" aria-pressed="false">em</button>
  </div>
</div>

<!-- Error -->
<div class="error-msg hidden" id="errorMsg" role="alert"></div>

<!-- Loader -->
<div class="loader-wrap" id="loader">
  <div class="spinner" aria-hidden="true"></div>
  <div class="loader-text">Scanning design tokens…</div>
</div>

<!-- Content -->
<div id="content" class="hidden">
  <div class="panel-wrap">
    <div id="panel" role="region" aria-live="polite" aria-label="Extracted tokens"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- Unified export modal -->
<div class="export-modal-overlay hidden" id="exportModalOverlay" aria-hidden="true">
  <div class="export-modal" role="dialog" aria-modal="true" aria-labelledby="exportModalTitle">
    <div class="export-modal-head">
      <div>
        <h3 id="exportModalTitle">Export Tokens</h3>
        <p id="exportModalSubtitle">Choose output type and format.</p>
      </div>
      <button class="icon-btn" id="closeExportModalBtn" aria-label="Close export modal" title="Close">✕</button>
    </div>

    <div class="export-modal-body">
      <label class="export-modal-label">Output type</label>
      <div class="export-family-chips" id="exportTargetChips" role="group">
        <button class="export-chip active" data-target="format" aria-pressed="true">Token format</button>
        <button class="export-chip" data-target="bundle" aria-pressed="false">Bundle</button>
        <button class="export-chip" data-target="audit" aria-pressed="false">Audit report</button>
      </div>

      <div id="exportFormatGroup">
        <label class="export-modal-label">Framework</label>
        <div class="export-family-chips" id="exportFamilyChips" role="group">
          <button class="export-chip active" data-family="web" aria-pressed="true">Web</button>
          <button class="export-chip" data-family="react" aria-pressed="false">React UI</button>
          <button class="export-chip" data-family="design" aria-pressed="false">Design tools</button>
          <button class="export-chip" data-family="standard" aria-pressed="false">Standard</button>
        </div>

        <label class="export-modal-label">Format</label>
        <select id="exportFormatSelect" class="exp-select" aria-label="Export format">
          <option value="css">CSS Variables</option>
          <option value="scss">SCSS</option>
          <option value="json">JSON</option>
        </select>
      </div>

      <div id="exportCustomizeGroup" class="export-customize-group">
        <label class="export-modal-label">Token categories</label>
        <div class="export-customize-list">
          <label><input type="checkbox" data-exp-cat="colors" checked /> Colors</label>
          <label><input type="checkbox" data-exp-cat="typography" checked /> Typography</label>
          <label><input type="checkbox" data-exp-cat="spacing" checked /> Spacing</label>
          <label><input type="checkbox" data-exp-cat="radius" checked /> Radius</label>
          <label><input type="checkbox" data-exp-cat="shadows" checked /> Shadows</label>
          <label><input type="checkbox" data-exp-cat="gradients" checked /> Gradients</label>
          <label><input type="checkbox" data-exp-cat="variables" checked /> Variables</label>
        </div>
      </div>

      <p class="exp-modal-note" id="exportModalNote">Copy or download token output for the selected format.</p>
    </div>

    <div class="export-modal-foot">
      <button class="btn-ghost" id="exportCopyBtn">Copy</button>
      <button class="exp-btn" id="exportDownloadBtn">Download</button>
    </div>
  </div>
</div>

<script src="js/popup.js"></script>
</body>
</html>
